<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>hypnos — presupuesto marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="lock">
  <input id="lock-input" type="password" placeholder="Clave">
  <button id="lock-btn">Entrar</button>
</div>

<div id="app" hidden>
  <header>
    <div style="display:flex; align-items:baseline; justify-content:space-between; gap:1rem; flex-wrap:wrap;">
      <h1>Presupuesto Marketing</h1>
      <div style="display:flex; align-items:center; gap:0.8rem;">
        <span id="last-update" style="font-size:0.78rem; color:var(--dim);"></span>
        <button id="refresh-btn" style="border:1px solid var(--border); background:#fff; padding:0.4rem 0.8rem; border-radius:4px; cursor:pointer; font-size:0.82rem;">Actualizar</button>
      </div>
    </div>
    <div id="kpis"></div>
    <div id="kpis-estado" class="grid-3" style="margin-bottom:2rem;"></div>
  </header>

  <nav>
    <button data-view="resumen" class="active">Resumen</button>
    <button data-view="mes">Por mes</button>
    <button data-view="trimestre">Por trimestre</button>
    <button data-view="categoria">Por categoría</button>
    <button data-view="tipoestado">Tipo y estado</button>
    <button data-view="informes">Informes</button>
  </nav>

  <main id="content"></main>
</div>

<script src="chart.umd.js"></script>
<script src="app.js"></script>
</body>
</html>
